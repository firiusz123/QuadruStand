# QuadruStand: network-shape benchmark and stand-up reward for quadruped locomotion in Isaac Lab.
#
# Isaac Lab / Isaac Sim / torch are NOT listed here: they are installed into the project's
# .venv by the Isaac Lab installer (see README.md, "Setup"). This file only declares our own package.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "quadru-stand"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "optuna>=4.0",
    "pytest>=9.1.1",
]

[project.entry-points."isaaclab.tasks"]
quadru_stand = "quadru_stand.tasks"

# Pyrefly (Cursor's default Python language server). The interpreter query
# is enough for packages that actually live in .venv (torch, isaacsim, optuna).
# Isaac Lab is an editable install that points at the source checkout, not a
# copy inside .venv — see README "Editable links".
[tool.pyrefly]
preset = "basic"
python-interpreter-path = ".venv/bin/python"
project-includes = ["src", "scripts", "tests"]
search-path = ["src"]
